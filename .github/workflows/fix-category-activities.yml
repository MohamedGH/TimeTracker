name: Add activity editing in category tree
on:
  push:
    branches: [ChatGPT]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add activity actions
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "${acts.map(a=>`<div class=\"activity-chain\"><b>↳ ${esc(a.name)}</b></div>`).join('')}"
          new = "${acts.map(a=>`<div class=\"activity-chain\"><b>↳ ${esc(a.name)}</b><span class=\"activity-actions\"><button class=\"icon-btn\" data-edit-tree-act=\"${a.id}\" title=\"Modifier l’activité\">✎</button><button class=\"icon-btn danger\" data-delete-tree-act=\"${a.id}\" title=\"Supprimer l’activité\">×</button></span></div>`).join('')}"
          if old not in s:
              raise SystemExit('activity tree block not found')
          s = s.replace(old, new)
          old2 = "document.querySelectorAll('[data-delete-cat]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.deleteCat))}"
          new2 = "document.querySelectorAll('[data-delete-cat]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.deleteCat));document.querySelectorAll('[data-edit-tree-act]').forEach(b=>b.onclick=()=>activityModal(b.dataset.editTreeAct));document.querySelectorAll('[data-delete-tree-act]').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.deleteTreeAct))}"
          if old2 not in s:
              raise SystemExit('category render hook not found')
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-category-activities.yml
          git commit -m 'Allow editing imported activities from category tree'
          git push
