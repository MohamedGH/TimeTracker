name: Fix index syntax
on:
  push:
    branches: [ChatGPT]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ChatGPT
      - name: Fix syntax and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("||'<div class=\"empty\">—</div>')}", "||'<div class=\"empty\">—</div>'}")
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/fix-index-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-index-syntax.yml
          git commit -m 'Fix index syntax after import date update' || exit 0
          git push origin HEAD:ChatGPT