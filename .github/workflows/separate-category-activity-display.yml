name: Separate categories and activities display
on:
  push:
    branches: [ChatGPT]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update category tree display
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = re.compile(r"function categoryTreeHtml\(parentId=null,depth=0\)\{.*?function renderCategories\(\)", re.S)
          new = '''function categoryTreeHtml(parentId=null,depth=0){
            const nodes=children(parentId);
            return nodes.map(c=>{
              const kids=children(c.id);
              const acts=data.activities.filter(a=>a.categoryId===c.id);
              const activityHtml=acts.length?`<div class="category-activities"><div class="category-activities-title">Activités</div>${acts.map(a=>`<div class="category-activity"><span class="activity-icon">▶</span><span class="activity-name">${esc(a.name)}</span><div class="activity-actions"><button class="icon-btn" data-edit-act="${a.id}" title="Modifier">✎</button><button class="icon-btn danger" data-delete-act="${a.id}" title="Supprimer">×</button></div></div>`).join('')}</div>`:'';
              return `<div class="node" style="--depth:${depth}"><div class="node-row"><span class="category-icon">📁</span><span class="node-name">${esc(c.name)}</span><span class="node-count">${acts.length} activité${acts.length!==1?'s':''}</span><div class="node-actions"><button class="icon-btn" data-add-sub="${c.id}" title="Créer une sous-catégorie">＋</button><button class="icon-btn" data-edit-cat="${c.id}" title="Modifier">✎</button><button class="icon-btn danger" data-delete-cat="${c.id}" title="Supprimer">×</button></div></div>${activityHtml}${kids.length?`<div class="children">${categoryTreeHtml(c.id,depth+1)}</div>`:''}</div>`
            }).join('')}
          function renderCategories()'''
          m=old.search(s)
          if not m:
              raise SystemExit('category tree block not found')
          s=old.sub(new,s)
          marker='.activity-chain{margin-left:10px;padding:7px 0 9px 22px;border-left:1px dashed var(--line)}'
          css=''' .activity-chain{margin-left:10px;padding:7px 0 9px 22px;border-left:1px dashed var(--line)}.category-activities{margin:2px 0 7px 28px;padding:8px 0 5px 13px;border-left:2px solid var(--line)}.category-activities-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:bold;margin-bottom:3px}.category-activity{display:flex;align-items:center;gap:7px;padding:5px 0}.activity-icon{font-size:10px;color:var(--muted)}.activity-name{font-weight:normal}.category-activity .activity-actions{margin-left:auto}.category-icon{font-size:15px}'''
          if marker in s and '.category-activities{' not in s:
              s=s.replace(marker, marker+css)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/separate-category-activity-display.yml
          git commit -m 'Separate category and activity display'
          git push
