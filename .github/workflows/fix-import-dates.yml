name: Fix imported entry dates

on:
  push:
    branches: [ChatGPT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ChatGPT
          fetch-depth: 0
      - name: Patch import date handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* imported-entry-date-fix-v1 */'
          if marker in s:
              raise SystemExit(0)

          helper = '''\n/* imported-entry-date-fix-v1 */\nfunction parseEntryDate(date,value){\n  if(value instanceof Date) return value;\n  const v=String(value??'').trim();\n  if(!v) return new Date(NaN);\n  if(/^\\d{4}-\\d{2}-\\d{2}T/.test(v)) return new Date(v);\n  if(/^\\d{2}:\\d{2}(:\\d{2})?$/.test(v)){\n    const d=String(date||today());\n    const t=v.length===5?v+':00':v;\n    return new Date(`${d}T${t}`);\n  }\n  return new Date(v);\n}\nfunction importedEntryDuration(e){\n  const explicit=Number(e.duration);\n  if(Number.isFinite(explicit)&&explicit>0) return explicit;\n  const mins=Number(e.mins);\n  if(Number.isFinite(mins)&&mins>0) return mins*60;\n  const s=parseEntryDate(e.date,e.start),en=parseEntryDate(e.date,e.end);\n  if(isNaN(s)||isNaN(en)) return 0;\n  let seconds=(en-s)/1000;\n  if(seconds<0) seconds+=86400;\n  return Math.max(0,seconds);\n}\n'''
          s = s.replace('function rebuildEntryLinks(d){', helper + '\nfunction rebuildEntryLinks(d){', 1)

          old = "if(Array.isArray(raw.entries)) d.entries=raw.entries.map(e=>({...e,id:e.id||uid(),activityId:e.activityId||null,date:e.date||today(),start:e.start||`${e.date||today()}T09:00`,end:e.end||null,duration:Number(e.duration)||0,note:e.note||''}));"
          new = "if(Array.isArray(raw.entries)) d.entries=raw.entries.map(e=>({...e,id:e.id||uid(),activityId:e.activityId||null,date:e.date||today(),start:e.start||`${e.date||today()}T09:00`,end:e.end||null,duration:importedEntryDuration(e),note:e.note||''}));"
          if old not in s:
              raise SystemExit('normalize entries pattern not found')
          s = s.replace(old,new,1)

          old2 = "function rebuildEntryLinks(d){d.entries.forEach(e=>{if(!e.activityId&&e.activity){let a=d.activities.find(x=>x.name===e.activity);if(!a){a={id:uid(),name:e.activity,path:[e.cat,e.sub].filter(Boolean),categoryId:null};d.activities.push(a)}e.activityId=a.id}if(e.duration===0&&e.start&&e.end){const s=new Date(e.start),en=new Date(e.end);if(!isNaN(s)&&!isNaN(en))e.duration=Math.max(0,(en-s)/1000)}})}"
          new2 = "function rebuildEntryLinks(d){d.entries.forEach(e=>{if(!e.activityId&&e.activity){let a=d.activities.find(x=>x.name===e.activity);if(!a){a={id:uid(),name:e.activity,path:[e.cat,e.sub].filter(Boolean),categoryId:null};d.activities.push(a)}e.activityId=a.id}if(e.duration===0&&e.start&&e.end)e.duration=importedEntryDuration(e)})}"
          if old2 not in s:
              raise SystemExit('rebuildEntryLinks pattern not found')
          s = s.replace(old2,new2,1)

          s = s.replace('new Date(e.start)', 'parseEntryDate(e.date,e.start)')
          s = s.replace('new Date(e.end)', 'parseEntryDate(e.date,e.end)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: correctly import legacy entry dates and durations"
          git push origin HEAD:ChatGPT
