name: Fix activity delete handler
on:
  push:
    branches: [ChatGPT]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix category tree activity handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "document.querySelectorAll('[data-delete-tree-act]').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.deleteTreeAct))"
          new = "document.querySelectorAll('[data-delete-act]').forEach(b=>b.onclick=()=>deleteActivity(b.dataset.deleteAct))"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-delete-activity.yml
          git commit -m "fix: delete activities from category tree"
          git push